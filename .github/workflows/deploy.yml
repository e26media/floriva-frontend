name: Deploy Frontend to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_FRONTEND_PATH != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_FRONTEND_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            if pm2 describe floriva-frontend > /dev/null 2>&1; then
              pm2 restart floriva-frontend
            elif pm2 describe frontend > /dev/null 2>&1; then
              pm2 restart frontend
            else
              pm2 restart all
            fi
